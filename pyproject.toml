[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optionsdesk"
version = "0.1.0"
description = "Bot de análisis de opciones GGAL — tasa implícita y renta"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "streamlit>=1.56",
    "pyarrow>=14.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "websocket-client>=1.8",
    "pyyaml>=6.0",
    "pyobd>=0.3",
    "smartmoneyconcepts>=0.0.27",
    "streamlit-autorefresh>=0.0.1",
    "duckdb>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests que usan servicios externos",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["optionsdesk*"]
