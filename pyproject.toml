[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optionsdesk"
version = "0.1.0"
description = "Bot de análisis de opciones GGAL — tasa implícita y renta"
requires-python = ">=3.11"
dependencies = [
    "pyhomebroker>=0.2",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "streamlit>=1.28",
    "pyarrow>=14.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pyobd>=0.3",
    "pandas-ta>=0.3.14b",
    "smartmoneyconcepts>=0.0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["optionsdesk*"]
