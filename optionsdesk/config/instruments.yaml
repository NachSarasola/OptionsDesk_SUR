# Watchlist y configuración de instrumentos GGAL
underlying: GGAL

# Codigos de vencimiento publicados por IOL para GGAL.
# Validado contra la cadena live el 2026-06-01. Actualizar al inicio de cada ciclo.
expiry_calendar:
  # Codigos observados en IOL el 2026-06-01
  J: "2026-06-19"
  JU: "2026-06-19"
  AG: "2026-08-21"

# Filtros de liquidez mínima
min_bid: 1.0           # prima mínima en el bid (ARS)
max_spread_pct: 30.0   # spread bid-ask máximo como % del mid
max_price_age_s: 300   # precio desactualizado después de N segundos

# Pricing
risk_free_rate: 0.00   # 0 = usa la caución como tasa base
pricing_steps: 100     # pasos del árbol CRR (100 es rápido; 200 para más precisión)

# Moneyness: ATM si |spot - strike| / spot < threshold
atm_threshold_pct: 2.0
